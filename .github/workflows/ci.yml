name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pydantic==2.13.4"
          python -m pip install -e packages/sqlrules-postgresql -e packages/sqlrules-sqlite \
            -e packages/sqlrules-mysql -e packages/sqlrules-mssql

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: |
          mypy src/sqlrules
          mypy --disable-error-code=redundant-cast \
            packages/sqlrules-postgresql/src packages/sqlrules-sqlite/src \
            packages/sqlrules-mysql/src packages/sqlrules-mssql/src

      - name: Version sync
        run: python scripts/check_versions.py

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pydantic==2.13.4"
          python -m pip install -e packages/sqlrules-postgresql -e packages/sqlrules-sqlite \
            -e packages/sqlrules-mysql -e packages/sqlrules-mssql

      - name: Tests
        run: >
          pytest tests
          packages/sqlrules-postgresql/tests
          packages/sqlrules-sqlite/tests
          packages/sqlrules-mysql/tests
          packages/sqlrules-mssql/tests

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build core
        run: python -m build

      - name: Twine check core
        run: twine check dist/*

      - name: Build dialect plugins
        run: |
          python -m build packages/sqlrules-postgresql --outdir dist-plugins
          python -m build packages/sqlrules-sqlite --outdir dist-plugins
          python -m build packages/sqlrules-mysql --outdir dist-plugins
          python -m build packages/sqlrules-mssql --outdir dist-plugins
          twine check dist-plugins/*

      - name: Install wheel and import
        run: |
          python -m pip install dist/*.whl dist-plugins/*.whl
          python - <<'PY'
          from typing import Annotated

          from pydantic import Field
          from sqlalchemy import Column, MetaData, String, Table

          import sqlrules
          from sqlrules import PLUGIN_API_VERSION, RuleSchema, pattern_text
          from sqlrules.conformance import run_basic_conformance
          from sqlrules_postgresql import PostgresPlugin
          from sqlrules_sqlite import SQLitePlugin
          from sqlrules_mysql import MysqlPlugin
          from sqlrules_mssql import MssqlPlugin

          assert sqlrules.__version__
          assert callable(sqlrules.compile)
          assert callable(sqlrules.where)
          assert callable(sqlrules.flatten)
          assert callable(sqlrules.notwhere)
          assert callable(pattern_text)
          assert PLUGIN_API_VERSION == "2"

          class LengthFilter(RuleSchema):
              name: Annotated[str, Field(min_length=2)]

          length_table = Table("items", MetaData(), Column("name", String))
          for plugin, operator, model, table in (
              (PostgresPlugin(), "pattern", None, None),
              (SQLitePlugin(), "pattern", None, None),
              (MysqlPlugin(), "pattern", None, None),
              (MssqlPlugin(), "min_length", LengthFilter, length_table),
          ):
              run_basic_conformance(plugin, operator=operator, model=model, table=table)
          print("wheel import ok:", sqlrules.__version__)
          PY

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Sphinx
        run: sphinx-build -W -b html docs docs/_build/html

  database-conformance:
    name: Live database conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlrules
          POSTGRES_PASSWORD: sqlrules-ci
          POSTGRES_DB: sqlrules
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlrules -d sqlrules"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sqlrules
          MYSQL_USER: sqlrules
          MYSQL_PASSWORD: sqlrules-ci
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SqlRules-ci!Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlRules-ci!Passw0rd' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      SQLRULES_TEST_POSTGRESQL_URL: postgresql+psycopg://sqlrules:sqlrules-ci@127.0.0.1:5432/sqlrules
      SQLRULES_TEST_MYSQL_URL: mysql+pymysql://sqlrules:sqlrules-ci@127.0.0.1:3306/sqlrules
      SQLRULES_TEST_MSSQL_URL: mssql+pymssql://sa:SqlRules-ci%21Passw0rd@127.0.0.1:1433/master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pydantic==2.13.4" "psycopg[binary]" pymysql pymssql
          python -m pip install -e packages/sqlrules-postgresql -e packages/sqlrules-sqlite \
            -e packages/sqlrules-mysql -e packages/sqlrules-mssql

      - name: Execute backend conformance corpus
        run: pytest -o addopts='' -q tests/test_live_backend_conformance.py

  checks:
    name: CI checks
    if: always()
    needs:
      - lint
      - test
      - package
      - docs
      - database-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.test.result }}"
            "${{ needs.package.result }}"
            "${{ needs.docs.result }}"
            "${{ needs.database-conformance.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more CI jobs failed: ${results[*]}"
              exit 1
            fi
          done
          echo "All CI jobs passed (lint, test, package, docs, database conformance)."
